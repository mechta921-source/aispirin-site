<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Коробка ПТО — скоро — Андрей Спирин</title>
  <meta name="description" content="Коробка ПТО для строительных компаний — сейчас в разработке. Скоро на этой странице." />
  <meta name="robots" content="noindex">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .wrap { max-width: 480px; }
    .code {
      font-size: 3.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #E8762B, #f59e42);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem; color: #f1f5f9; }
    p { color: #94a3b8; font-size: 1rem; line-height: 1.6; margin-bottom: 2rem; }
    a.btn {
      display: inline-block;
      background: #E8762B;
      color: #fff;
      text-decoration: none;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }
    a.btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">🏗️ Скоро</div>
    <h1>Коробка ПТО в разработке</h1>
    <p>Готовим коробку для отдела ПТО строительной компании — заявки, сметы, договоры, чертежи под ключ. Страница появится, когда продукт будет готов.</p>
    <a href="/" class="btn">На главную</a>
  </div>
</body>
</html>
